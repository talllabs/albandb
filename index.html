<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PH18 Guest Stay Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      margin-bottom: 8px;
    }
    p {
      color: #555;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input,
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 80px;
    }
    button {
      margin-top: 28px;
      padding: 14px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }
    .checkbox {
      margin-top: 16px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<h1>PH18 Guest Stay Request</h1>
<p>If you haven't already, please check available dates before submitting this request.</p>

<form
  name="ph18-guest-stay"
  method="POST"
  data-netlify="true"
  data-netlify-honeypot="bot-field"
  enctype="multipart/form-data"
>

  <!-- Required for Netlify -->
  <input type="hidden" name="form-name" value="ph18-guest-stay" />

  <!-- Honeypot field -->
  <p class="hidden">
    <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
  </p>

  <label>Your Name</label>
  <input type="text" name="first_name" placeholder="First Name" required />
  <input type="text" name="last_name" placeholder="Last Name" required />

  <label>Additional Guest Names</label>
  <textarea name="additional_guests"></textarea>

  <label>Phone Number</label>
  <input type="tel" name="phone" placeholder="(000) 000-0000" required />

  <label>Email</label>
  <input type="email" name="email" placeholder="example@example.com" required />

  <label>Arrival – Date and Time</label>
  <input type="datetime-local" name="arrival" required />

  <label>Departure – Date and Time</label>
  <input type="datetime-local" name="departure" required />

  <label>Please check which rooms you will need</label>
  <textarea name="rooms_needed" required></textarea>

  <label>License Plate Number</label>
  <input type="text" name="license_plate" />

  <label>Make & Model of Vehicle</label>
  <input type="text" name="vehicle" />

  <label>Upload FRONT of Driver’s License</label>
  <input type="file" name="license_front" accept="image/*" />

  <label>Upload BACK of Driver’s License</label>
  <input type="file" name="license_back" accept="image/*" />

  <label>Additional Vehicle Details (if any)</label>
  <textarea name="additional_vehicle"></textarea>

  <label>Any Additional Details?</label>
  <textarea name="notes"></textarea>

  <div class="checkbox">
    <label>
      <input type="checkbox" required />
      Please verify that you are human
    </label>
  </div>

  <button type="submit">Send Request</button>

</form>

<p style="margin-top: 24px; font-size: 14px; color: #666;">
Thank you for completing the request to stay at PH18. We will review availability and, if approved, send a confirmation email with check-in details and further instructions.
</p>

</body>
</html>
